services:
  - type: web
    name: truebuild-engine
    env: docker
    region: ohio
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: credit-acceleration-crm
    env: node
    region: ohio
    plan: free
    rootDir: credit-crm
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - credit.sumthin3lse.com
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
